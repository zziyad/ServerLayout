services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-api
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-change-me-use-long-random}
      APP_SECRET: ${APP_SECRET:-local-dev-change-me-use-long-random}
      WATCH_POLL: ${WATCH_POLL:-1}
      WATCH_POLL_MS: ${WATCH_POLL_MS:-1000}
      LLM_ENABLED: ${LLM_ENABLED:-1}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8080}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen2.5-14B-Instruct-GGUF:Q4_K_M}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-sandbox}
      EMAIL_SANDBOX_RECIPIENT: ${EMAIL_SANDBOX_RECIPIENT:-}
      EMAIL_AUTO_PROCESS_ENABLED: ${EMAIL_AUTO_PROCESS_ENABLED:-false}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_SECURE: ${EMAIL_SECURE:-false}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8010}:8010"
    volumes:
      - ./application:/usr/server/application
      - ./src:/usr/server/src
      - ./lib:/usr/server/lib
      - ./main.js:/usr/server/main.js
      - ./.applications:/usr/server/.applications
      - ./uploads:/usr/server/uploads
      - ./log:/usr/server/log
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: app-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./application/db:/opt/app-db:ro
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: app-redis
    command: >
      sh -c 'if [ -n "$${REDIS_PASSWORD}" ]; then
        redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}";
      else
        redis-server --appendonly yes;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG; else redis-cli ping | grep PONG; fi",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    container_name: app-nginx
    profiles: ["proxy"]
    ports:
      - "${NGINX_HTTP_PORT:-8081}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep healthy"]
      interval: 30s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: app-pgadmin
    profiles: ["admin"]
    user: "0:0"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DISABLE_POSTFIX: "true"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  pgadmin-data:

networks:
  default:
    name: app-network
